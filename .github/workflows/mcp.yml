name: MCP server checks

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "apps/mcp-server/**"
      - ".github/workflows/mcp.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/mcp-server/**"
      - ".github/workflows/mcp.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: apps/mcp-server/pyproject.toml
      - name: Install MCP package
        run: python -m pip install -e "apps/mcp-server[dev]"
      - name: Lint
        run: ruff check apps/mcp-server
      - name: Test
        run: pytest -q apps/mcp-server/tests
