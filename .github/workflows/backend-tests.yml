name: Backend checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Detect backend project
        id: detect
        shell: bash
        run: |
          if [ -f apps/backend/pyproject.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: apps/backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        if: steps.detect.outputs.present == 'true'
        working-directory: apps/backend
        run: pytest -q
      - name: Foundation status
        if: steps.detect.outputs.present == 'false'
        run: echo "Backend skeleton is pending Phase 1 implementation."
