name: Frontend checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Detect frontend project
        id: detect
        shell: bash
        run: |
          if [ -f apps/frontend/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: apps/frontend
        run: npm install
      - name: Lint frontend
        if: steps.detect.outputs.present == 'true'
        working-directory: apps/frontend
        run: npm run lint
      - name: Build frontend
        if: steps.detect.outputs.present == 'true'
        working-directory: apps/frontend
        run: npm run build
      - name: Foundation status
        if: steps.detect.outputs.present == 'false'
        run: echo "Frontend skeleton is pending Phase 1 implementation."
