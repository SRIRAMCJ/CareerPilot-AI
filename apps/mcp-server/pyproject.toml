[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "careerpilot-mcp"
version = "0.1.0"
description = "MCP server exposing safe CareerPilot AI workspace tools"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.9,<2.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "pytest-asyncio>=0.24,<1.0", "ruff>=0.6,<1.0"]

[project.scripts]
careerpilot-mcp = "careerpilot_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["careerpilot_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
